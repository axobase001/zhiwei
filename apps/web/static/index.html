<!doctype html>
<html lang="zh-CN" data-lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知微 · Zhiwei</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <div class="brand-mark">知</div>
        <div class="brand-copy">
          <div class="brand-name" data-i18n="brand.name">知微</div>
          <div class="brand-slogan" data-i18n="brand.slogan">见微知著，见构知文。</div>
        </div>
      </div>

      <div class="paper-context">
        <div class="context-eyebrow" data-i18n="header.currentPaper">当前论文</div>
        <div class="context-title-row">
          <h1 id="paper-title">载入中</h1>
          <span id="status-pill" class="paper-badge">示例论文</span>
        </div>
        <div id="paper-meta" class="context-meta">2017 · NeurIPS · 经典架构论文</div>
      </div>

      <div class="header-actions">
        <div class="language-switch" role="group" aria-label="Language">
          <button class="lang-btn active" type="button" data-lang="zh">中</button>
          <button class="lang-btn" type="button" data-lang="en">EN</button>
        </div>
        <form id="upload-form" class="upload-form">
          <label class="upload-trigger">
            <input id="pdf-input" type="file" name="pdf" accept="application/pdf" />
            <span data-i18n="actions.upload">上传 PDF</span>
          </label>
          <progress id="upload-progress" value="0" max="100"></progress>
        </form>
        <button id="reparse-btn" class="ghost-btn" type="button" data-i18n="actions.reparse">重新解析</button>
        <div class="export-wrap">
          <button id="export-menu-btn" class="primary-btn" type="button" data-i18n="actions.export">导出</button>
          <div id="export-menu" class="export-menu">
            <button type="button" data-export="json">Paper IR JSON</button>
            <button type="button" data-export="markdown" data-i18n="actions.exportMarkdown">Markdown 学习笔记</button>
            <button type="button" data-export="png" data-i18n="actions.exportPng">PNG 图谱</button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <aside class="source-pane">
        <section class="paper-card">
          <div class="paper-card-eyebrow" data-i18n="source.paperSource">论文源文</div>
          <h2 id="side-paper-title">Attention Is All You Need</h2>
          <div id="side-paper-authors" class="paper-authors">Ashish Vaswani et al.</div>
          <div id="side-paper-tags" class="tag-row"></div>
          <p id="side-paper-summary" class="paper-one-liner"></p>
          <div id="overview-side-actions" class="overview-side-actions">
            <span class="mode-pill" data-i18n="source.overviewMode">总览模式</span>
            <button id="side-view-source-btn" class="ghost-btn" type="button" data-i18n="source.viewSource">查看原文</button>
            <button id="side-enter-detail-btn" class="primary-btn" type="button" data-i18n="source.enterDetail">进入详情工作台</button>
          </div>
        </section>

        <section class="library-strip">
          <div class="mini-heading" data-i18n="library.title">论文库</div>
          <div class="paper-picker" id="paper-picker">
            <button id="paper-picker-btn" class="paper-picker-btn" type="button" aria-expanded="false" aria-controls="paper-list">
              <span>
                <em data-i18n="library.current">当前论文</em>
                <strong id="paper-picker-current">载入中</strong>
              </span>
              <b aria-hidden="true">⌄</b>
            </button>
            <label class="paper-search">
              <span data-i18n="library.regexSearch">正则搜索</span>
              <input id="paper-search-input" type="search" placeholder="例如: resnet|lora|rag" data-i18n-placeholder="library.searchPlaceholder" autocomplete="off" />
            </label>
            <div id="paper-search-hint" class="paper-search-hint">默认显示最重要的论文</div>
            <div id="paper-list" class="paper-list" role="listbox" aria-label="选择论文" data-i18n-aria-label="library.choosePaper"></div>
          </div>
        </section>

        <section class="pdf-toolbar">
          <button class="tiny-btn" id="prev-page-btn" type="button" data-i18n="source.prevPage">上一页</button>
          <label class="page-field">
            <span data-i18n="source.page">页码</span>
            <input id="page-input" type="number" min="1" value="1" />
          </label>
          <button class="tiny-btn" id="next-page-btn" type="button" data-i18n="source.nextPage">下一页</button>
          <label class="zoom-field">
            <span data-i18n="source.zoom">缩放</span>
            <select id="zoom-select">
              <option value="90">90%</option>
              <option value="100" selected>100%</option>
              <option value="120">120%</option>
            </select>
          </label>
        </section>

        <section id="reader-canvas" class="reader-canvas">
          <iframe id="pdf-frame" class="pdf-frame" title="PDF 原文" data-i18n-title="source.pdfTitle"></iframe>
          <div id="demo-source-state" class="demo-source-state"></div>
        </section>

        <section class="source-inspector">
          <div class="inspector-head">
            <div>
              <div class="mini-heading" data-i18n="source.currentSource">当前来源</div>
              <div id="source-meta" class="source-meta">尚未选择 anchor</div>
            </div>
            <button id="locate-source-btn" class="tiny-btn" type="button" data-i18n="source.locate">定位原文</button>
          </div>
          <div id="source-text" class="source-text">点击任意节点或证据来源后，这里显示原文摘录。</div>
        </section>
      </aside>

      <section class="workspace-pane">
        <nav id="module-tabs" class="module-tabs"></nav>
        <div id="detail-nav" class="detail-nav">
          <button id="back-overview-btn" class="back-btn" type="button" data-i18n="detail.backOverview">← 返回总览</button>
        </div>
        <section class="module-intro">
          <div>
            <div id="module-eyebrow" class="context-eyebrow">知微·构</div>
            <h2 id="module-title">结构解析</h2>
          </div>
          <p id="module-desc">从问题、方法、实验到结论，重建论文的结构骨架。</p>
        </section>
        <div id="warnings" class="warnings"></div>
        <div id="workspace" class="workspace"></div>
      </section>

      <aside class="evidence-pane">
        <section id="detail-panel" class="detail-panel"></section>
        <details id="correction-details" class="correction-drawer">
          <summary data-i18n="correction.summary">修正这个节点</summary>
          <form id="correction-form">
            <label>
              <span data-i18n="correction.title">标题</span>
              <input id="correction-title" />
            </label>
            <label>
              <span data-i18n="correction.description">解释</span>
              <textarea id="correction-description" rows="4"></textarea>
            </label>
            <div class="correction-actions">
              <button class="primary-btn" type="submit" data-i18n="correction.save">保存修正</button>
              <button class="ghost-btn" id="mark-incorrect-btn" type="button" data-i18n="correction.markIncorrect">标记不准确</button>
            </div>
          </form>
        </details>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
